<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f5f6f8;
        color: #1f2430;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #15171b;
        color: #e3e7ef;
        color-scheme: dark;
      }
    </style>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('agentdeck.ui.v1') || 'null');
        if (
          p?.version === 1 &&
          p.theme === 'dark' &&
          typeof p.sidebarCollapsed === 'boolean' &&
          Number.isFinite(p.sidebarWidth) &&
          p.sidebarWidth >= 200 &&
          p.sidebarWidth <= 320 &&
          Number.isFinite(p.fileWidth) &&
          p.fileWidth >= 360 &&
          p.fileWidth <= 520
        ) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        /* 存储不可用时保持浅色首屏。 */
      }
    </script>
    <link rel="icon" type="image/png" href="/src/ui/assets/agentdeck.png" />
    <title>AgentDeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
